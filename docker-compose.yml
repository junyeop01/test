services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: "file:../data/dev.db"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: "7d"
      UPLOAD_DIR: "./uploads"
      CORS_ORIGIN: "*"
    volumes:
      - app-data:/app/server/data
      - app-uploads:/app/server/uploads
    restart: unless-stopped

volumes:
  app-data:
  app-uploads:
